# ============================================================================
# Pragmatic type checking — a gate against real mistakes, not a rewrite.
# ============================================================================
# Deliberately NOT strict: mypy's default only checks annotated functions, so
# the newer typed code (eval_service's loader, metrics and run manifest) is
# covered while the older CLI presentation helpers stay as they are. Tighten
# this when there's a concrete bug it would have caught, not before.
# ============================================================================

[mypy]
python_version = 3.11
files = config.py, services, eval, tests
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True

# The only blanket exemption: this stack (LangChain, Ollama, pgvector, MLflow,
# sentence-transformers) ships no usable type information, and no stub
# packages exist for it. `ignore_missing_imports` applies ONLY to imports that
# genuinely resolve to nothing — it never silences errors in our own code.
ignore_missing_imports = True
# Don't type-check third-party internals we happen to import; use their types,
# report only our own mistakes.
follow_imports = silent
